<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1565C0"><meta name="color-scheme" content="light dark"><meta name="application-name" content="Averis Care Command">
  <meta name="description" content="Averis — a real-time healthcare operations command center.">
  <title>Averis — Healthcare Operations Command Center</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/averis-mark.svg">
  <link rel="preconnect" href="https://images.pexels.com">
  <link rel="preload" as="image" href="https://images.pexels.com/photos/6129507/pexels-photo-6129507.jpeg?auto=compress&cs=tinysrgb&w=1800"><link rel="stylesheet" href="styles.css">
</head>
<body><a class="skip-link" href="#content">Skip to content</a>
  <div class="site-backdrop" aria-hidden="true">
  <div class="backdrop-fallback"></div>
  <img id="backdropPhoto" src="https://images.pexels.com/photos/6129507/pexels-photo-6129507.jpeg?auto=compress&cs=tinysrgb&w=1800&q=82" alt="">
  <div class="backdrop-wash"></div>
</div>
<div class="ambient" aria-hidden="true">
    <span class="fog fog-a"></span>
    <span class="fog fog-b"></span>
    <span class="fog fog-c"></span>
    <span class="particle-field"></span>
  </div>

  <div id="toastHost" aria-live="polite" aria-atomic="true"></div>

  <div class="app-shell" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <button class="brand" data-view="overview" aria-label="Averis Command Center">
          <span class="brand-mark"><i></i><b></b></span>
          <span>
            <strong>Averis</strong>
            <small>CARE COMMAND</small>
          </span>
        </button>
        <button class="icon-btn mobile-close" id="closeSidebar" aria-label="Close navigation">×</button>
      </div>

      <div class="workspace-card">
        <div class="workspace-avatar">M</div>
        <div class="workspace-meta">
          <strong>Mahi Health</strong>
          <span>Care Operations Workspace</span>
        </div>
        <span class="status-dot"></span>
      </div>

      <nav class="side-nav" id="nav"></nav>

      <div class="sidebar-bottom">
        <div class="system-card">
          <div class="system-line"><span class="pulse-dot"></span><span>Live systems</span><strong id="systemLatency">18 ms</strong></div>
          <div class="system-bar"><span id="systemBarFill"></span></div>
          <small id="syncText">Synchronised just now</small>
        </div>
        <button class="profile-row" id="profileButton">
          <span class="avatar">M</span>
          <span><strong>Mahi</strong><small>Healthcare Operations</small></span>
          <span class="profile-chevron">⌄</span>
        </button>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" id="openSidebar" aria-label="Open navigation">☰</button>
          <div class="crumbs"><span>Averis</span><b>/</b><strong id="crumbView">Command Center</strong></div>
          <button class="search-pill" id="openCommand" aria-label="Open global search">
            <span class="search-icon">⌕</span>
            <span>Search patients, tasks, appointments…</span>
            <kbd>Ctrl K</kbd>
          </button>
        </div>
        <div class="topbar-actions">
          <div class="live-chip"><span class="pulse-dot"></span><strong>LIVE</strong><span id="liveTime">--:--:--</span></div>
          <button class="icon-btn" id="refreshLive" title="Sync live data">↻</button>
          <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
          <div class="notif-wrap">
            <button class="icon-btn notif-button" id="notifButton" title="Notifications">◔<span id="notifCount">4</span></button>
            <div class="popover notifications" id="notificationsPopover"></div>
          </div>
        </div>
      </header>

      <main class="content" id="content">
        <section class="view active" id="view-overview"></section>
        <section class="view" id="view-patients"></section>
        <section class="view" id="view-appointments"></section>
        <section class="view" id="view-care"></section>
        <section class="view" id="view-clinical"></section>
        <section class="view" id="view-providers"></section>
        <section class="view" id="view-pharmacy"></section>
        <section class="view" id="view-lab"></section>
        <section class="view" id="view-beds"></section>
        <section class="view" id="view-emergency"></section>
        <section class="view" id="view-queue"></section>
        <section class="view" id="view-patient360"></section>
        <section class="view" id="view-billing"></section>
        <section class="view" id="view-messages"></section>
        <section class="view" id="view-tasks"></section>
        <section class="view" id="view-analytics"></section>
        <section class="view" id="view-ai"></section>
        <section class="view" id="view-reports"></section>
        <section class="view" id="view-settings"></section>
      </main>

      <footer class="footer">
        <span>Averis Care Command • Mahi Health Workspace</span>
        <span><span class="footer-dot"></span><span id="footerStatus">All systems nominal</span></span>
      </footer>
    </div>
  </div>

  <div class="modal-layer" id="modalLayer"></div>

  <script src="app.js"></script>
</body>
</html>
