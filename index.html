<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="color-scheme" content="dark light"><link rel="preload" href="https://www.ihhhealthcare.com/images/default-source/ihh/occ-2.jpg?sfvrsn=2801dfb4_1" as="image"><link rel="preload" href="https://res.cloudinary.com/casden-edito/images/c_scale%2Cw_2048%2Ch_1442%2Cdpr_2/f_auto%2Cq_auto/v1699015961/prod/recrutement-FPH/recrutement-FPH.jpg?_i=AA" as="image"><link rel="preload" href="https://healthtechmagazine.net/sites/healthtechmagazine.net/files/styles/flexslider_full/public/2020-02/HT_Q120_Feat-Hennick-slide3-2.jpg?itok=GF9w27yz" as="image"><link rel="preload" href="https://www.hopkinsmedicine.org/-/media/radiology/location-sliders/bethesda-imaging-equip-1.jpg?h=500&hash=D2C50F66AFD899814CF9A9C301BD40C8&iar=0&w=960" as="image">
<meta name="description" content="AVERIS by Mahi — local synthetic healthcare operations intelligence portfolio simulation.">
<link rel="icon" href="./assets/averis-orbit.svg">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css?v=9">
<title>AVERIS — by Mahi</title>
</head>
<body>
<div class="backdrop-scene"><div class="scene-grid"></div><div class="scene-orbit scene-orbit-a"></div><div class="scene-orbit scene-orbit-b"></div><div class="scene-light scene-light-a"></div><div class="scene-light scene-light-b"></div></div>
<a class="skip-link" href="#workspace-root">Skip to workspace</a>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand-row">
    <a href="#/today" class="brand"><span class="brand-logo"><img src="./assets/averis-orbit.svg" alt=""></span><span><b>AVERIS</b><small>by Mahi · OPERATIONS OS</small></span></a>
    <button id="sidebar-close" class="icon-button mobile-only" type="button" aria-label="Close navigation">×</button>
  </div>
  <div class="identity"><span class="avatar avatar-main">M</span><div><b id="profile-name">Mahi</b><small id="profile-role">Control room owner</small></div><span class="presence"></span></div>
  <button id="command-trigger" class="command-open" type="button"><span>⌕</span><div><b>Command search</b><small>People · work · spaces</small></div><kbd>⌘K</kbd></button>
  <div class="nav-label"><span>WORKSPACES</span><b>18</b></div>
  <nav class="nav" aria-label="Workspaces"><button class="nav-item" data-route="today" type="button"><span class="nav-icon">⌂</span><span>Today</span><i class="nav-dot" data-dot="today"></i></button>
<button class="nav-item" data-route="people" type="button"><span class="nav-icon">◉</span><span>People</span><i class="nav-dot" data-dot="people"></i></button>
<button class="nav-item" data-route="journeys" type="button"><span class="nav-icon">↗</span><span>Journeys</span><i class="nav-dot" data-dot="journeys"></i></button>
<button class="nav-item" data-route="queue" type="button"><span class="nav-icon">≡</span><span>Queue</span><i class="nav-dot" data-dot="queue"></i></button>
<button class="nav-item" data-route="schedule" type="button"><span class="nav-icon">◷</span><span>Schedule</span><i class="nav-dot" data-dot="schedule"></i></button>
<button class="nav-item" data-route="capacity" type="button"><span class="nav-icon">▦</span><span>Capacity</span><i class="nav-dot" data-dot="capacity"></i></button>
<button class="nav-item" data-route="workforce" type="button"><span class="nav-icon">◌</span><span>Workforce</span><i class="nav-dot" data-dot="workforce"></i></button>
<button class="nav-item" data-route="diagnostics" type="button"><span class="nav-icon">⌁</span><span>Diagnostics</span><i class="nav-dot" data-dot="diagnostics"></i></button>
<button class="nav-item" data-route="pharmacy" type="button"><span class="nav-icon">✚</span><span>Pharmacy</span><i class="nav-dot" data-dot="pharmacy"></i></button>
<button class="nav-item" data-route="finance" type="button"><span class="nav-icon">◇</span><span>Finance</span><i class="nav-dot" data-dot="finance"></i></button>
<button class="nav-item" data-route="messages" type="button"><span class="nav-icon">✉</span><span>Messages</span><i class="nav-dot" data-dot="messages"></i></button>
<button class="nav-item" data-route="incidents" type="button"><span class="nav-icon">⚠</span><span>Incidents</span><i class="nav-dot" data-dot="incidents"></i></button>
<button class="nav-item" data-route="quality" type="button"><span class="nav-icon">✓</span><span>Quality</span><i class="nav-dot" data-dot="quality"></i></button>
<button class="nav-item" data-route="insights" type="button"><span class="nav-icon">◫</span><span>Insights</span><i class="nav-dot" data-dot="insights"></i></button>
<button class="nav-item" data-route="assistant" type="button"><span class="nav-icon">✦</span><span>Assistant</span><i class="nav-dot" data-dot="assistant"></i></button>
<button class="nav-item" data-route="reports" type="button"><span class="nav-icon">▤</span><span>Reports</span><i class="nav-dot" data-dot="reports"></i></button>
<button class="nav-item" data-route="audit" type="button"><span class="nav-icon">◌</span><span>Audit</span><i class="nav-dot" data-dot="audit"></i></button>
<button class="nav-item" data-route="settings" type="button"><span class="nav-icon">⚙</span><span>Settings</span><i class="nav-dot" data-dot="settings"></i></button></nav>
  <div class="side-footer">
    <div class="side-visual"><img src="https://res.cloudinary.com/casden-edito/images/c_scale%2Cw_2048%2Ch_1442%2Cdpr_2/f_auto%2Cq_auto/v1699015961/prod/recrutement-FPH/recrutement-FPH.jpg?_i=AA" alt="Healthcare coordination team"></div><div class="simulation-badge"><span class="pulse-dot"></span><div><b>SIMULATED / LOCAL</b><small>No patient data · no external AI</small></div></div>
    <button id="focus-button" class="focus-button" type="button"><span>◉</span> Focus mode <kbd>F</kbd></button>
  </div>
</aside>
<div class="shell-main">
<header class="topbar">
  <button id="menu-button" class="icon-button mobile-only" type="button" aria-label="Open navigation">☰</button>
  <div class="breadcrumbs"><span>AVERIS</span><i>/</i><b id="crumb-current">Today</b></div>
  <div class="top-actions">
    <button id="theme-button" class="icon-button theme-button" data-action="theme-toggle" type="button" aria-label="Switch theme">☾</button>
    <span class="local-chip"><span></span> Local simulation</span>
    <div class="clock"><b id="live-clock">--:--:--</b><small id="live-date">---</small></div>
    <button id="quick-add" class="icon-button" type="button" aria-label="Create record">＋</button>
    <button id="notification-button" class="icon-button notif" type="button" aria-label="Open messages">◔<b id="notification-count">0</b></button>
    <button id="profile-button" class="profile-button" type="button" aria-label="Profile"><span class="avatar avatar-main">M</span></button>
  </div>
</header>
<main id="workspace-root" class="workspace-main" tabindex="-1"><div class="loader"><div></div><p>Loading control room…</p></div></main>
</div>
</div>
<div class="mobile-scrim" id="mobile-scrim"></div>
<div class="overlay" id="command-overlay" hidden><div class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="command-title">
  <div class="dialog-head"><div><span class="eyebrow">NAVIGATION</span><h2 id="command-title">Command search</h2></div><button class="icon-button" data-close="command-overlay" type="button">×</button></div>
  <div class="command-box"><span>⌕</span><input id="command-input" placeholder="Search AVERIS…" autocomplete="off"><kbd>ESC</kbd></div>
  <div id="command-results" class="command-results"></div>
  <div class="command-help"><span>↑↓ select</span><span>↵ open</span><span>esc close</span></div>
</div></div>
<div class="overlay" id="modal-overlay" hidden><div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="dialog-head"><div><span class="eyebrow" id="modal-eyebrow">ACTION</span><h2 id="modal-title">New record</h2></div><button class="icon-button" data-close="modal-overlay" type="button">×</button></div>
  <div id="modal-body" class="modal-body"></div><div id="modal-foot" class="modal-foot"></div>
</div></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head"><div><span class="eyebrow" id="drawer-eyebrow">DETAIL</span><h2 id="drawer-title">Record</h2></div><button id="drawer-close" class="icon-button" type="button">×</button></div><div id="drawer-body" class="drawer-body"></div></aside>
<div id="toast-stack" class="toast-stack" aria-live="polite"></div>
<noscript><div class="noscript"><b>JavaScript is required for the AVERIS control room.</b><span>Everything is local to this browser.</span></div></noscript>
<script src="./app.js?v=9" defer></script>
</body>
</html>
