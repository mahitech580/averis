[build]
  publish = "dist"
  command = "node --check app.js && python scripts/validate_site.py && python scripts/build_pages.py --output dist"

[build.environment]
  PYTHON_VERSION = "3.12"

# Keep the browser API same-origin so session cookies and API auth use one origin.
# _redirects mirrors this rule for hosts that process that file; both target Supabase.
[[redirects]]
  from = "/api/*"
  to = "https://zspustvmjtdsnfkprbvv.supabase.co/functions/v1/averis-api/api/:splat"
  status = 200
  force = true
