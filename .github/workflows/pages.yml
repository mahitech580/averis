name: Deploy AVERIS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate Python syntax
        run: python -m compileall -q generate_data.py backend frameworks tests
      - name: Validate static site references and cache versions
        run: python scripts/validate_site.py
      - name: Test FastAPI backend
        run: |
          python -m pip install -r backend/requirements.txt
          DATABASE_URL=sqlite:///./ci_averis.db APP_ENV=test python -m pytest -q
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
