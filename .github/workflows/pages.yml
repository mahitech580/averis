name: Build and deploy AVERIS to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate Python syntax
        run: python -m compileall -q generate_data.py backend frameworks tests
      - name: Validate static site references and cache versions
        run: python scripts/validate_site.py
      - name: Test FastAPI backend
        run: |
          python -m pip install -r backend/requirements.txt
          DATABASE_URL=sqlite:///./ci_averis.db APP_ENV=test python -m pytest -q
      - name: Install isolated API and browser test tools
        run: |
          mkdir -p /tmp/averis-ci-tools
          npm --prefix /tmp/averis-ci-tools install --no-save --no-package-lock playwright@1.64.1 newman@6.2.1
          cp scripts/ui-smoke.mjs /tmp/averis-ci-tools/ui-smoke.mjs
          /tmp/averis-ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Postman API integration collection
        run: |
          APP_ENV=test DATABASE_URL=sqlite:////tmp/averis-ci-tools/postman_averis.db python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/averis-ci-tools/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          /tmp/averis-ci-tools/node_modules/.bin/newman run postman/AVERIS-ERP.postman_collection.json --bail --timeout-request 20000
      - name: Browser UI smoke tests (Chromium)
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/averis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          node /tmp/averis-ci-tools/ui-smoke.mjs
      - name: Verify production Supabase API health
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          url = "https://zspustvmjtdsnfkprbvv.supabase.co/functions/v1/averis-api/api/health"
          public_key = "sb_publishable_NKhKySO2mf12Sxpu99EKrw_FQ_ahH-h"
          error = None
          for attempt in range(8):
              try:
                  request = Request(url, headers={"apikey": public_key, "accept": "application/json"})
                  with urlopen(request, timeout=12) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  if body.get("status") != "ok" or body.get("database_driver") != "postgresql":
                      raise RuntimeError("Production API health contract mismatch: " + json.dumps(body))
                  print("Production API healthy: PostgreSQL persistence confirmed.")
                  break
              except Exception as exc:
                  error = exc
                  if attempt == 7:
                      raise SystemExit("Production API health verification failed: " + repr(error))
                  time.sleep(3)
          PY
      - name: Verify live Python ML endpoints
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          base = "https://averis-platform-api-mahi.onrender.com"
          headers = {"content-type": "application/json", "X-Averis-Request": "1"}
          payloads = [
              ("/api/ai/triage-public", {"text": "Critical inventory shortage is blocking tomorrow's operations workflow."}),
              ("/api/ai/inventory/anomalies-public", {"items": [
                  {"id": f"CI-{i}", "name": f"Synthetic item {i}", "sku": f"CI-{i}",
                   "quantity": 1 if i == 9 else 20 + i, "reorder_level": 5,
                   "unit_cost": 10 + i, "selling_price": 20 + i}
                  for i in range(10)
              ]}),
          ]
          last_error = None
          for attempt in range(10):
              try:
                  results = []
                  for path, body in payloads:
                      req = Request(base + path, data=json.dumps(body).encode(), headers=headers, method="POST")
                      with urlopen(req, timeout=20) as response:
                          results.append(json.loads(response.read().decode("utf-8")))
                  triage, inventory = results
                  assert triage.get("category") in {"inventory", "scheduling", "capacity", "workflow", "communications", "quality"}
                  assert triage.get("priority") in {"CRITICAL", "HIGH", "NORMAL"}
                  assert triage.get("clinical_decisioning") is False
                  assert inventory.get("scanned") == 10
                  assert inventory.get("reorder_risk_count", 0) >= 1
                  assert inventory.get("clinical_decisioning") is False
                  print("Python ML service verified: triage and inventory anomaly endpoints returned valid non-clinical results.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 9:
                      raise SystemExit("Python ML verification failed: " + repr(last_error))
                  print("Python ML service not ready yet; retry", attempt + 1)
                  time.sleep(5)
          PY
      - name: Build clean static-only publish artifact
        run: python scripts/build_pages.py --output dist
      - name: Deploy Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is missing. Add it to GitHub Actions secrets or connect this Netlify site directly to the repository's main branch."
            exit 1
          fi
          npx --yes netlify-cli@23.11.0 deploy --prod --dir dist --site b67c38c4-93c9-4f01-b175-b75e00d0675c
      - name: Verify published Netlify frontend and proxied API
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base = "https://averis-saas.netlify.app/"
          public_key = "sb_publishable_NKhKySO2mf12Sxpu99EKrw_FQ_ahH-h"

          def fetch(url, headers=None):
              request = Request(url, headers={"User-Agent": "AVERIS-Netlify-smoke/1.0", **(headers or {})})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return response.read().decode("utf-8", "replace")

          last_error = None
          for attempt in range(10):
              try:
                  html = fetch(base)
                  app_match = re.search(r"""<script[^>]+src=["']([^"']*app\.js\?v=(\d+))["']""", html, re.I)
                  css_match = re.search(r"""<link[^>]+href=["']([^"']*styles\.css\?v=(\d+))["']""", html, re.I)
                  if not app_match or not css_match:
                      raise RuntimeError("Published HTML is missing versioned app.js or styles.css.")
                  app_ref, app_version = app_match.group(1), app_match.group(2)
                  css_ref, css_version = css_match.group(1), css_match.group(2)
                  if app_version != "47" or css_version != "47" or app_version != css_version:
                      raise RuntimeError(f"Netlify is not serving the expected v47 asset set (app={app_version}, css={css_version}).")
                  app_js = fetch(urljoin(base, app_ref))
                  css = fetch(urljoin(base, css_ref))
                  sw = fetch(urljoin(base, "sw.js"))
                  cache_match = re.search(r"""const CACHE=['"]averis-by-mahi-v(\d+)['"]""", sw)
                  if not cache_match or cache_match.group(1) != "47":
                      raise RuntimeError("Netlify service-worker cache is not v47.")
                  if len(app_js) < 10000 or len(css) < 10000 or "AVERIS" not in app_js:
                      raise RuntimeError("Published Netlify assets are incomplete.")
                  health_raw = fetch(urljoin(base, "api/health"), {"apikey": public_key, "accept": "application/json"})
                  health = json.loads(health_raw)
                  if health.get("status") != "ok" or health.get("database_driver") != "postgresql":
                      raise RuntimeError("Netlify API rewrite did not return the PostgreSQL health contract.")
                  print("Netlify production verified: app.js/css v47, service-worker v47, and same-origin API rewrite to PostgreSQL are healthy.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 9:
                      raise SystemExit("Netlify production verification failed: " + repr(last_error))
                  print("Waiting for Netlify production propagation; retry", attempt + 1)
                  time.sleep(5)
          PY
