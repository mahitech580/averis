name: Build and deploy AVERIS to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate Python syntax
        run: python -m compileall -q generate_data.py backend frameworks tests
      - name: Validate static site references and cache versions
        run: python scripts/validate_site.py
      - name: Test FastAPI backend
        run: |
          python -m pip install -r backend/requirements.txt
          DATABASE_URL=sqlite:///./ci_averis.db APP_ENV=test python -m pytest -q
      - name: Install isolated API and browser test tools
        run: |
          mkdir -p /tmp/averis-ci-tools
          npm --prefix /tmp/averis-ci-tools install --no-save --no-package-lock playwright@1.64.1 newman@6.2.1
          cp scripts/ui-smoke.mjs /tmp/averis-ci-tools/ui-smoke.mjs
          /tmp/averis-ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Run Postman API integration collection
        run: |
          APP_ENV=test DATABASE_URL=sqlite:////tmp/averis-ci-tools/postman_averis.db python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/averis-ci-tools/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          /tmp/averis-ci-tools/node_modules/.bin/newman run postman/AVERIS-ERP.postman_collection.json --bail --timeout-request 20000
      - name: Browser UI smoke tests (Chromium)
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/averis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          node /tmp/averis-ci-tools/ui-smoke.mjs
      - name: Verify production Supabase API health
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          url = "https://zspustvmjtdsnfkprbvv.supabase.co/functions/v1/averis-api/api/health"
          public_key = "sb_publishable_NKhKySO2mf12Sxpu99EKrw_FQ_ahH-h"
          error = None
          for attempt in range(8):
              try:
                  request = Request(url, headers={"apikey": public_key, "accept": "application/json"})
                  with urlopen(request, timeout=12) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  if body.get("status") != "ok" or body.get("database_driver") != "postgresql":
                      raise RuntimeError("Production API health contract mismatch: " + json.dumps(body))
                  print("Production API healthy: PostgreSQL persistence confirmed.")
                  break
              except Exception as exc:
                  error = exc
                  if attempt == 7:
                      raise SystemExit("Production API health verification failed: " + repr(error))
                  time.sleep(3)
          PY
      - name: Verify live Python ML endpoints
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          base = "https://averis-platform-api-mahi.onrender.com"
          headers = {"content-type": "application/json", "X-Averis-Request": "1"}
          payloads = [
              ("/api/ai/triage-public", {"text": "Critical inventory shortage is blocking tomorrow's operations workflow."}),
              ("/api/ai/inventory/anomalies-public", {"items": [
                  {"id": f"CI-{i}", "name": f"Synthetic item {i}", "sku": f"CI-{i}",
                   "quantity": 1 if i == 9 else 20 + i, "reorder_level": 5,
                   "unit_cost": 10 + i, "selling_price": 20 + i}
                  for i in range(10)
              ]}),
          ]
          last_error = None
          for attempt in range(10):
              try:
                  results = []
                  for path, body in payloads:
                      req = Request(base + path, data=json.dumps(body).encode(), headers=headers, method="POST")
                      with urlopen(req, timeout=20) as response:
                          results.append(json.loads(response.read().decode("utf-8")))
                  triage, inventory = results
                  assert triage.get("category") in {"inventory", "scheduling", "capacity", "workflow", "communications", "quality"}
                  assert triage.get("priority") in {"CRITICAL", "HIGH", "NORMAL"}
                  assert triage.get("clinical_decisioning") is False
                  assert inventory.get("scanned") == 10
                  assert inventory.get("reorder_risk_count", 0) >= 1
                  assert inventory.get("clinical_decisioning") is False
                  print("Python ML service verified: triage and inventory anomaly endpoints returned valid non-clinical results.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 9:
                      raise SystemExit("Python ML verification failed: " + repr(last_error))
                  print("Python ML service not ready yet; retry", attempt + 1)
                  time.sleep(5)
          PY
      - name: Build clean static-only publish artifact
        run: python scripts/build_pages.py --output dist
      - name: Deploy Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            npx --yes netlify-cli@23.11.0 deploy --prod --dir dist --site b67c38c4-93c9-4f01-b175-b75e00d0675c
          else
            echo "::warning::NETLIFY_AUTH_TOKEN is absent; no CLI deployment was performed. This workflow cannot assume Netlify Git continuous deployment is connected. The production checks below must independently prove that the new revision is live."
          fi
      - name: Verify published Netlify frontend and proxied API
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base = "https://averis-saas.netlify.app/"
          public_key = "sb_publishable_NKhKySO2mf12Sxpu99EKrw_FQ_ahH-h"

          def fetch(url, headers=None):
              request = Request(url, headers={"User-Agent": "AVERIS-Netlify-smoke/1.0", **(headers or {})})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return response.read().decode("utf-8", "replace")

          def cache_control(url):
              request = Request(url, headers={"User-Agent": "AVERIS-Netlify-smoke/1.0"})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return response.headers.get("Cache-Control", "").lower()

          last_error = None
          for attempt in range(10):
              try:
                  html = fetch(base)
                  app_match = re.search(r"""<script[^>]+src=["']([^"']*app\.js\?v=(\d+))["']""", html, re.I)
                  css_match = re.search(r"""<link[^>]+href=["']([^"']*styles\.css\?v=(\d+))["']""", html, re.I)
                  if not app_match or not css_match:
                      raise RuntimeError("Published HTML is missing versioned app.js or styles.css.")
                  source_html = Path("index.html").read_text(encoding="utf-8")
                  source_app_match = re.search(r"""<script[^>]+src=["']([^"']*app\.js\?v=(\d+))["']""", source_html, re.I)
                  source_css_match = re.search(r"""<link[^>]+href=["']([^"']*styles\.css\?v=(\d+))["']""", source_html, re.I)
                  if not source_app_match or not source_css_match:
                      raise RuntimeError("Source HTML is missing versioned app.js or styles.css.")
                  expected_version = source_app_match.group(2)
                  if source_css_match.group(2) != expected_version:
                      raise RuntimeError("Source HTML has inconsistent app.js and styles.css versions.")

                  app_ref, app_version = app_match.group(1), app_match.group(2)
                  css_ref, css_version = css_match.group(1), css_match.group(2)

                  # Fetch actual response bodies before reporting version mismatch.
                  # This distinguishes complete asset files from 404s or HTML fallback bodies.
                  app_js = fetch(urljoin(base, app_ref))
                  css = fetch(urljoin(base, css_ref))
                  sw = fetch(urljoin(base, "sw.js"))
                  import hashlib
                  app_sha256 = hashlib.sha256(app_js.encode("utf-8")).hexdigest()
                  css_sha256 = hashlib.sha256(css.encode("utf-8")).hexdigest()
                  app_security_fix = "function sanitizeMarkup(markup)" in app_js
                  css_drawer_fix = ".drawer{z-index:110}" in css
                  print("Observed live assets: " + json.dumps({
                      "app_url": urljoin(base, app_ref),
                      "app_bytes": len(app_js),
                      "app_sha256": app_sha256,
                      "app_has_workspace_html_sanitizer": app_security_fix,
                      "css_url": urljoin(base, css_ref),
                      "css_bytes": len(css),
                      "css_sha256": css_sha256,
                      "css_has_drawer_layer_fix": css_drawer_fix,
                      "html_app_version": app_version,
                      "html_css_version": css_version,
                      "expected_version": expected_version,
                  }, sort_keys=True))
                  if len(app_js) < 10000 or len(css) < 10000 or "AVERIS" not in app_js:
                      raise RuntimeError("Published JS/CSS responses are incomplete or are not the expected asset types.")
                  if app_version != expected_version or css_version != expected_version or not app_security_fix or not css_drawer_fix:
                      raise RuntimeError(
                          f"Netlify is serving stale or mismatched frontend assets: expected v{expected_version}, "
                          f"live app={app_version} (HTML sanitizer present={app_security_fix}, sha256={app_sha256}), "
                          f"css={css_version} (drawer z-index fix present={css_drawer_fix}, sha256={css_sha256})."
                      )
                  cache_match = re.search(r"""const CACHE=['"]averis-by-mahi-v(\d+)['"]""", sw)
                  if not cache_match or cache_match.group(1) != expected_version:
                      raise RuntimeError(f"Netlify service-worker cache does not match v{expected_version}.")
                  try:
                      published_revision = fetch(urljoin(base, "build-revision.txt")).strip()
                  except Exception as exc:
                      raise RuntimeError("Published artifact does not expose build-revision.txt; exact source revision cannot be verified.") from exc
                  expected_revision = os.environ.get("GITHUB_SHA", "").strip()
                  if not expected_revision or published_revision != expected_revision:
                      raise RuntimeError(f"Netlify source revision mismatch: expected {expected_revision or 'current GitHub SHA'}, live {published_revision}.")

                  html_cache = cache_control(base)
                  app_cache = cache_control(urljoin(base, app_ref))
                  css_cache = cache_control(urljoin(base, css_ref))
                  sw_cache = cache_control(urljoin(base, "sw.js"))
                  if not ("no-cache" in html_cache or "max-age=0" in html_cache):
                      raise RuntimeError("HTML cache policy is not revalidating on each visit.")
                  if "immutable" not in app_cache or "max-age=31536000" not in app_cache:
                      raise RuntimeError("app.js does not use long-lived versioned asset caching.")
                  if "immutable" not in css_cache or "max-age=31536000" not in css_cache:
                      raise RuntimeError("styles.css does not use long-lived versioned asset caching.")
                  if "no-store" not in sw_cache and "no-cache" not in sw_cache:
                      raise RuntimeError("Service worker response may remain stale in browser caches.")

                  health_raw = fetch(urljoin(base, "api/health"), {"apikey": public_key, "accept": "application/json"})
                  health = json.loads(health_raw)
                  if health.get("status") != "ok" or health.get("database_driver") != "postgresql":
                      raise RuntimeError("Netlify API rewrite did not return the PostgreSQL health contract.")
                  print(f"Netlify production verified: source {expected_revision}, app.js/css v{expected_version}, matching service-worker cache, cache-control policies, and PostgreSQL-backed same-origin API are healthy.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 9:
                      raise SystemExit("Netlify production verification failed: " + repr(last_error))
                  print("Waiting for Netlify production propagation; retry", attempt + 1)
                  time.sleep(5)
          PY
