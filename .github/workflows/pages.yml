name: Build, test, and deploy AVERIS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout main revision
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate JavaScript
        run: node --check app.js

      - name: Validate Python syntax
        run: python -m compileall -q generate_data.py backend frameworks tests scripts

      - name: Validate static site and Pages API contract
        run: python scripts/validate_site.py

      - name: Test FastAPI backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          DATABASE_URL=sqlite:///./ci_averis.db APP_ENV=test python -m pytest -q

      - name: Install isolated API and browser test tools
        run: |
          mkdir -p /tmp/averis-ci-tools
          npm --prefix /tmp/averis-ci-tools install --no-save --no-package-lock playwright@1.64.1 newman@6.2.1
          cp scripts/ui-smoke.mjs /tmp/averis-ci-tools/ui-smoke.mjs
          /tmp/averis-ci-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Run Postman API integration collection
        run: |
          APP_ENV=test DATABASE_URL=sqlite:////tmp/averis-ci-tools/postman_averis.db python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/averis-ci-tools/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 1
          done
          /tmp/averis-ci-tools/node_modules/.bin/newman run postman/AVERIS-ERP.postman_collection.json --bail --timeout-request 20000

      - name: Browser UI smoke tests (Chromium)
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/averis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          node /tmp/averis-ci-tools/ui-smoke.mjs

      - name: Verify production Supabase API and GitHub Pages CORS
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          url = "https://zspustvmjtdsnfkprbvv.supabase.co/functions/v1/averis-api/api/health"
          public_key = "sb_publishable_NKhKySO2mf12Sxpu99EKrw_FQ_ahH-h"
          pages_origin = "https://mahitech580.github.io"
          last_error = None
          for attempt in range(8):
              try:
                  request = Request(url, headers={
                      "apikey": public_key,
                      "accept": "application/json",
                      "Origin": pages_origin,
                  })
                  with urlopen(request, timeout=12) as response:
                      body = json.loads(response.read().decode("utf-8"))
                      allow_origin = response.headers.get("Access-Control-Allow-Origin")
                  if body.get("status") != "ok" or body.get("database_driver") != "postgresql":
                      raise RuntimeError("Production API health contract mismatch: " + json.dumps(body))
                  if allow_origin != pages_origin:
                      raise RuntimeError("Supabase did not allow GitHub Pages origin: " + repr(allow_origin))
                  print("Supabase API healthy: PostgreSQL persistence confirmed and GitHub Pages CORS accepted.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 7:
                      raise SystemExit("Production API/CORS verification failed: " + repr(last_error))
                  time.sleep(3)
          PY

      - name: Verify live Python ML endpoints
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          base = "https://averis-platform-api-mahi.onrender.com"
          headers = {"content-type": "application/json", "X-Averis-Request": "1"}
          payloads = [
              ("/api/ai/triage-public", {"text": "Critical inventory shortage is blocking tomorrow's operations workflow."}),
              ("/api/ai/inventory/anomalies-public", {"items": [
                  {"id": f"CI-{i}", "name": f"Synthetic item {i}", "sku": f"CI-{i}",
                   "quantity": 1 if i == 9 else 20 + i, "reorder_level": 5,
                   "unit_cost": 10 + i, "selling_price": 20 + i}
                  for i in range(10)
              ]}),
          ]
          last_error = None
          for attempt in range(10):
              try:
                  results = []
                  for path, body in payloads:
                      req = Request(base + path, data=json.dumps(body).encode(), headers=headers, method="POST")
                      with urlopen(req, timeout=20) as response:
                          results.append(json.loads(response.read().decode("utf-8")))
                  triage, inventory = results
                  assert triage.get("category") in {"inventory", "scheduling", "capacity", "workflow", "communications", "quality"}
                  assert triage.get("priority") in {"CRITICAL", "HIGH", "NORMAL"}
                  assert triage.get("clinical_decisioning") is False
                  assert inventory.get("scanned") == 10
                  assert inventory.get("reorder_risk_count", 0) >= 1
                  assert inventory.get("clinical_decisioning") is False
                  print("Python ML service verified: triage and inventory endpoints returned valid non-clinical results.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 9:
                      raise SystemExit("Python ML verification failed: " + repr(last_error))
                  print("Python ML service not ready yet; retry", attempt + 1)
                  time.sleep(5)
          PY

      - name: Build clean static-only GitHub Pages artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/build_pages.py --output dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAGES_URL: ${{ needs.deploy.outputs.page_url }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the tested source revision
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify live GitHub Pages files and build revision
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          base = os.environ["PAGES_URL"].rstrip("/") + "/"
          expected_revision = os.environ["GITHUB_SHA"].strip()

          def fetch(url):
              request = Request(url, headers={"User-Agent": "AVERIS-GitHub-Pages-smoke/1.0"})
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return response.read()

          live_html = fetch(base)
          live_index = live_html.decode("utf-8", "replace")
          if live_html != Path("index.html").read_bytes():
              raise RuntimeError("Published index.html does not match the tested source commit.")

          app_match = re.search(r"""<script[^>]+src=["']([^"']*app\.js\?v=(\d+))["']""", live_index, re.I)
          css_match = re.search(r"""<link[^>]+href=["']([^"']*styles\.css\?v=(\d+))["']""", live_index, re.I)
          if not app_match or not css_match:
              raise RuntimeError("Published HTML is missing versioned app.js or styles.css.")
          if app_match.group(2) != css_match.group(2):
              raise RuntimeError("Published JavaScript and CSS version query strings differ.")

          app_bytes = fetch(urljoin(base, app_match.group(1)))
          css_bytes = fetch(urljoin(base, css_match.group(1)))
          sw_bytes = fetch(urljoin(base, "sw.js"))
          manifest_bytes = fetch(urljoin(base, "manifest.json"))
          if app_bytes != Path("app.js").read_bytes():
              raise RuntimeError("Published app.js does not match the tested source commit.")
          if css_bytes != Path("styles.css").read_bytes():
              raise RuntimeError("Published styles.css does not match the tested source commit.")
          if sw_bytes != Path("sw.js").read_bytes():
              raise RuntimeError("Published service worker does not match the tested source commit.")
          if manifest_bytes != Path("manifest.json").read_bytes():
              raise RuntimeError("Published manifest.json does not match the tested source commit.")

          sw = sw_bytes.decode("utf-8", "replace")
          cache_match = re.search(r"""const CACHE=['"]averis-by-mahi-v(\d+)['"]""", sw)
          expected_version = app_match.group(2)
          if not cache_match or cache_match.group(1) != expected_version:
              raise RuntimeError("Published service-worker cache version does not match the HTML assets.")

          revision = fetch(urljoin(base, "build-revision.txt")).decode("utf-8", "replace").strip()
          if revision != expected_revision:
              raise RuntimeError(f"Published revision mismatch: expected {expected_revision}, live {revision}.")
          for name, data in (("app.js", app_bytes), ("styles.css", css_bytes), ("sw.js", sw_bytes)):
              print(f"{name}: {len(data)} bytes sha256={hashlib.sha256(data).hexdigest()}")
          print(f"GitHub Pages release verified: revision {revision}; core assets match source; asset version v{expected_version}.")
          PY
