name: Deploy AVERIS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate Python syntax
        run: python -m compileall -q generate_data.py backend frameworks tests
      - name: Validate static site references and cache versions
        run: python scripts/validate_site.py
      - name: Test FastAPI backend
        run: |
          python -m pip install -r backend/requirements.txt
          DATABASE_URL=sqlite:///./ci_averis.db APP_ENV=test python -m pytest -q
      - name: Browser UI smoke tests (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/averis-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/ui-smoke.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy Netlify production when configured
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not configured; Netlify deploy skipped."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir . --site b67c38c4-93c9-4f01-b175-b75e00d0675c
