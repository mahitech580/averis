services:
  - type: web
    name: averis-platform-api-mahi
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://averis-saas.netlify.app,https://mahitech580.github.io
previews:
  generation: off
